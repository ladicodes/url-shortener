{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7fa; }
        .container { max-width: 600px; margin-top: 80px; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 5px; background-color: #e9f7ef; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
<div class="container text-center">
    <h1 class="mb-4">URL Shortener</h1>
    <form method="POST">
        {% csrf_token %}
        <div class="input-group mb-3">
            <input type="url" name="original_url" class="form-control" placeholder="Enter your long URL" required>
            <button class="btn btn-primary" type="submit">Shorten</button>
        </div>
    </form>

    {% if short_url %}
    <div class="result-box">
        <p>Shortened URL:</p>
        <a href="{{ short_url }}" target="_blank">{{ short_url }}</a>
        <button class="btn btn-outline-secondary btn-sm ms-2" onclick="navigator.clipboard.writeText('{{ short_url }}')">Copy</button>
    </div>
    {% endif %}
</div>
</body>
</html>
